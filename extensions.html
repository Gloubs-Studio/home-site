<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloubs Studio — Extensions</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/site.js" defer></script>
</head>
<body>

    <div id="sidebar-container"></div>
    <div id="topbar-container"></div>

    <main class="main">
        <div class="page-header">
            <h1>Extensions</h1>
            <p>Addons for LibreOffice.</p>
        </div>

        <div class="content-grid">

            <article class="card">
                <div class="card-video">
                    <video autoplay muted loop playsinline controls>
                        <source src="./assets/demo_privacyscanner.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="card-body">
                    <h3 class="card-title">Privacy Scanner</h3>
                    <p class="card-desc">PII detection tool for Writer.</p>
                    <span class="card-tag">Privacy</span>
                </div>
            </article>

            <article class="card">
                <div class="card-video">
                    <video autoplay muted loop playsinline controls>
                        <source src="./assets/demo_tagtostyle.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="card-body">
                    <h3 class="card-title">TagToStyle</h3>
                    <p class="card-desc">Auto-style formatting</p>
                    <span class="card-tag">Text formatting</span>
                </div>
            </article>

            <article class="card">
                <div class="card-video">
                    <video autoplay muted loop playsinline controls>
                        <source src="./assets/demo_accesschecker.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="card-body">
                    <h3 class="card-title">Accessibility Checker</h3>
                    <p class="card-desc">Scans and reports about a document accessiblity</p>
                    <span class="card-tag">Accessibility</span>
                </div>
            </article>
            
        </div>
    </main>
</body>
</html>
