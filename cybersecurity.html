<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloubs Studio — Cybersecurity</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="js/site.js" defer></script>
</head>
<body>

    <div id="sidebar-container"></div>
    <div id="topbar-container"></div>

    <main class="main">
        <div class="page-header">
            <h1>CyberSecurity</h1>
            <p>Tools made for Linux Mint 22 Cinnamon LTS (Ubuntu 24.04 LTS base)</p>
        </div>

        <div class="content-grid">

            <article class="card">
                <div class="card-video">
                    <video autoplay muted loop playsinline controls>
                        <source src="./assets/demo_cvescanner.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="card-body">
                    <h3 class="card-title">CVE Scanner</h3>
                    <p class="card-desc">Detect vulnerabilities for running process.</p>
                    <span class="card-tag">CyberSecurity</span>
                </div>
            </article>
            
        </div>
    </main>
</body>
</html>
