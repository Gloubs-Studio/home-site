<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloubs Studio — Cybersecurity</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/site.js" defer></script>
</head>
<body>

    <div id="sidebar-container"></div>
    <div id="topbar-container"></div>

    <main class="main">
        <div class="page-header">
            <h1>Mobile Apps</h1>
            <p>Mobile apps for Android. All apps data are stored locally on smartphone. No Ads no bloats.</p>
        </div>

        <div class="content-grid">

            <article class="card">
                <div class="card-video">
                    <video autoplay muted loop playsinline controls>
                        <source src="./assets/demo_plotsimply.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="card-body">
                    <h3 class="card-title">Plot Simply</h3>
                    <p class="card-desc">Collect data and plot on the go.</p>
                    <span class="card-tag">Data</span>
                </div>
            </article>

            <article class="card">
                <div class="card-video">
                    <video autoplay muted loop playsinline controls>
                        <source src="./assets/demo_rec.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="card-body">
                    <h3 class="card-title">Rec.</h3>
                    <p class="card-desc">A simple recorder that does just that.</p>
                    <span class="card-tag">Audio</span>
                </div>
            </article>
            
        </div>
    </main>
</body>
</html>
