<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloubs Studio — Featured</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="js/site.js" defer></script>
</head>
<body>

    <div id="sidebar-container"></div>
    <div id="topbar-container"></div>

    <main class="main">
        
        <div class="page-header">
            <h3>Featured</h3>
        </div>
        <div class="GS-banner"><img src="./assets/GSbannerImage.png" alt="Banner"></div>
        <div class="content-grid">
            <div class="section-header"><h2>Linux Apps</h2></div>

            <article class="card">
                <div class="card-video">
                    <video autoplay muted loop playsinline controls>
                        <source src="./assets/demo_coffeereader.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="card-body">
                    <h3 class="card-title">Coffee Text Reader</h3>
                    <p class="card-desc">A customisable text viewer with autoscroll functionality.</p>
                    <span class="card-tag">Utility</span>
                </div>
            </article>

            <article class="card">
                <div class="card-video">
                    <video autoplay muted loop playsinline controls>
                        <source src="./assets/demo_advertiser.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="card-body">
                    <h3 class="card-title">Advertiser</h3>
                    <p class="card-desc">An app for text advertising.</p>
                    <span class="card-tag">Marketing</span>
                </div>
            </article>

            <div class="section-header"><h2>Extensions</h2></div>

            <article class="card">
                <div class="card-video">
                    <video autoplay muted loop playsinline controls>
                        <source src="./assets/demo_tagtostyle.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="card-body">
                    <h3 class="card-title">Tag to Style</h3>
                    <p class="card-desc">Auto-style formatting.</p>
                    <span class="card-tag">LibreOffice</span>
                </div>
            </article>

            <article class="card">
                <div class="card-video">
                    <video autoplay muted loop playsinline controls>
                        <source src="./assets/demo_privacyscanner.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="card-body">
                    <h3 class="card-title">Privacy Scanner</h3>
                    <p class="card-desc">PII detection tool.</p>
                    <span class="card-tag">LibreOffice</span>
                </div>
            </article>
        </div>
    </main>
</body>
</html>
